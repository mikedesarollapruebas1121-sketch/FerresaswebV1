<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferresasweb | Usuarios</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<!-- Llamamos al menú compartido -->
<div th:replace="fragments/navbar :: nav"></div>

<main class="container">
    <section class="card">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
            <div>
                <h2>Usuarios</h2>
                <p class="description">Consulta, registra, modifica o elimina usuarios del sistema.</p>
            </div>
            <!-- El botón redirige al formulario de creación -->
            <a th:href="@{/view/usuarios/nuevo}" class="btn btn-primary">+ Registrar usuario</a>
        </div>

        <div style="overflow-x: auto;">
            <table class="table" id="tablaUsuarios" style="width: 100%; border-collapse: collapse;">
                <thead>
                <tr style="border-bottom: 1px solid var(--border);">
                    <th style="padding: 12px; text-align: left;">Acciones</th>
                    <th style="padding: 12px; text-align: left;">ID</th>
                    <th style="padding: 12px; text-align: left;">Documento</th>
                    <th style="padding: 12px; text-align: left;">Nombre</th>
                    <th style="padding: 12px; text-align: left;">Apellido</th>
                    <th style="padding: 12px; text-align: left;">Correo</th>
                    <th style="padding: 12px; text-align: left;">Teléfono</th>
                </tr>
                </thead>
                <tbody>
                <!-- Ejemplo iterando con Thymeleaf desde tu controlador -->
                <tr th:each="usuario : ${usuarios}" style="border-bottom: 1px solid var(--border);">
                    <td style="padding: 12px;">
                        <a th:href="@{/view/usuarios/editar/{id}(id=${usuario.id_usuario})}" class="btn btn-secondary" style="padding: 4px 10px; font-size: 12px;">Editar</a>
                        <a th:href="@{/view/usuarios/eliminar/{id}(id=${usuario.id_usuario})}" class="btn btn-terciary" style="padding: 4px 10px; font-size: 12px; color: #ef4444;">Eliminar</a>
                    </td>
                    <td style="padding: 12px;" th:text="${usuario.id_usuario}">1</td>
                    <td style="padding: 12px;" th:text="${usuario.documento}">999999991</td>
                    <td style="padding: 12px;" th:text="${usuario.nombre}">DAVID</td>
                    <td style="padding: 12px;" th:text="${usuario.apellido}">PEREZ</td>
                    <td style="padding: 12px;" th:text="${usuario.correo}">asd@gmail.com</td>
                    <td style="padding: 12px;" th:text="${usuario.telefono}">1234562342</td>
                </tr>
                </tbody>
            </table>
        </div>
        <p style="margin-top: 15px; font-size: 14px; color: var(--muted);" th:text="'Total de usuarios: ' + ${#lists.size(usuarios)}">Total de usuarios: 1</p>
    </section>
</main>
</body>
</html>

<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ferresasweb | Inicio de sesión</title>
    <link rel="stylesheet" th:href="@{/css/styles.css}">
</head>
<body>
<main class="auth-container">
    <section class="card login-card">
        <h1>Ferresasweb</h1>
        <p class="description" style="margin-bottom: 24px;">Sistema de gestión para ferretería</p>
        <h2>Login</h2>

        <form id="formLogin">
            <div class="form-group">
                <label for="correo">Correo</label>
                <input type="email" id="correo" placeholder="Ingrese su correo electrónico" required>
            </div>

            <div class="form-group">
                <label for="password">Contraseña</label>
                <input type="password" id="password" placeholder="Ingresa tu contraseña" required>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Iniciar</button>
        </form>

        <div class="links">
            <a href="#">Recuperar Contraseña</a>
            <a th:href="@{/usuarios/registro}">Registrarse</a>
        </div>
    </section>
</main>

<script th:src="@{/js/main.js}"></script>
</body>
</html>
